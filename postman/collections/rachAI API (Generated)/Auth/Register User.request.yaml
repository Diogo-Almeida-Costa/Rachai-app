$kind: http-request
url: "{{base_url}}/rachai/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "firstName": "Test",
        "lastName": "User",
        "email": "testuser{{$randomInt}}@example.com",
        "password": "password123",
        "profilePicture": "http://example.com/pic.jpg",
        "bio": "A test user account."
    }
order: 1000
