$kind: http-request
url: "{{base_url}}/rachai/expenses"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{auth_token}}
body:
  type: text
  content: |-
    {
        "description": "Dinner with friends",
        "amount": 50.75,
        "groupId": {{groupId}},
        "paidByUserId": {{userId}},
        "involvedUserIds": [{{userId}}, {{friendId}}]
    }
order: 1000
