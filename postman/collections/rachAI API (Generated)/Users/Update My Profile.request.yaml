$kind: http-request
url: "{{base_url}}/rachai/users/me"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{auth_token}}
body:
  type: text
  content: |-
    {
        "firstName": "Updated",
        "lastName": "User",
        "profilePicture": "http://example.com/updated_pic.jpg",
        "bio": "An updated test user account."
    }
order: 3000
