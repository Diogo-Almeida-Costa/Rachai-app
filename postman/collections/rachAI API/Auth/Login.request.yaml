$kind: http-request
url: "{{base_url}}/rachai/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "user@example.com",
        "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.environment.set("auth_token", jsonData.token);
      }
    language: text/javascript
order: 2000
